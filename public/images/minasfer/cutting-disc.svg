<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Disco abrasivo para corte de metal</title>
  <desc id="desc">Disco de corte vermelho e azul com furo central, sobre fundo claro.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9eff0"/></linearGradient>
    <radialGradient id="disc" cx="38%" cy="32%"><stop stop-color="#174db2"/><stop offset=".72" stop-color="#0c2d73"/><stop offset="1" stop-color="#081c47"/></radialGradient>
    <linearGradient id="rim" x2="1" y2="1"><stop stop-color="#ff4137"/><stop offset=".5" stop-color="#e72225"/><stop offset="1" stop-color="#a70c19"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="15"/><feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="rotate(-12 450 300)">
    <circle cx="450" cy="300" r="232" fill="#7b101d"/>
    <circle cx="450" cy="286" r="225" fill="url(#rim)"/>
    <circle cx="450" cy="286" r="190" fill="url(#disc)" stroke="#f0f4f8" stroke-width="5"/>
    <circle cx="450" cy="286" r="145" fill="none" stroke="#8db5ff" stroke-opacity=".42" stroke-width="2"/>
    <circle cx="450" cy="286" r="110" fill="none" stroke="#8db5ff" stroke-opacity=".25" stroke-width="2"/>
    <path d="M280 222 A190 190 0 0 1 613 200" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    <text x="450" y="153" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4">MINAS FER</text>
    <text x="450" y="421" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">CORTE • METAL</text>
    <text x="450" y="450" text-anchor="middle" fill="#b8d4ff" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">7 POLEGADAS</text>
    <circle cx="450" cy="286" r="37" fill="#d7e0e8"/>
    <circle cx="450" cy="286" r="20" fill="#374957"/>
    <circle cx="450" cy="286" r="11" fill="#17252a"/>
  </g>
  <text x="450" y="560" text-anchor="middle" fill="#17252a" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">DISCO ABRASIVO PARA AÇO E SERRALHERIA</text>
</svg>
